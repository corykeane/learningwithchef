<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta content="width=device-width, initial-scale=1.0" name="viewport">
  <title>{% if page.seo_title %}{{ page.seo_title }}{% else %}{{ page.title }} | {{ site.title }}{% endif %}</title>
  <meta name="description" content="{{ page.description | default: site.description }}">
  <link rel="canonical" href="{{ page.url | absolute_url }}">

  <!-- Open Graph -->
  <meta property="og:type" content="{% if page.youtube_id %}video.other{% else %}website{% endif %}">
  <meta property="og:site_name" content="{{ site.title }}">
  <meta property="og:title" content="{{ page.title | default: site.title }}">
  <meta property="og:description" content="{{ page.description | default: site.description }}">
  <meta property="og:url" content="{{ page.url | absolute_url }}">
  {%- if page.youtube_id %}
  <meta property="og:image" content="https://i.ytimg.com/vi/{{ page.youtube_id }}/hqdefault.jpg">
  <meta property="og:video" content="https://www.youtube.com/embed/{{ page.youtube_id }}">
  <meta name="twitter:card" content="summary_large_image">
  {%- endif %}

  <!-- Favicons -->
  <link rel="icon" href="{{ '/assets/favicon.ico' | relative_url }}">
  <link rel="apple-touch-icon" sizes="180x180" href="{{ '/assets/apple-touch-icon.png' | relative_url }}">
  <link rel="icon" type="image/png" sizes="32x32" href="{{ '/assets/favicon-32x32.png' | relative_url }}">
  <link rel="icon" type="image/png" sizes="16x16" href="{{ '/assets/favicon-16x16.png' | relative_url }}">
  <link rel="manifest" href="{{ '/assets/site.webmanifest' | relative_url }}">

  <!-- Fonts -->
  <link href="https://fonts.googleapis.com" rel="preconnect">
  <link href="https://fonts.gstatic.com" rel="preconnect" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100;0,300;0,400;0,500;0,700;0,900;1,100;1,300;1,400;1,500;1,700;1,900&family=Noto+Sans:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&family=Questrial:wght@400&display=swap" rel="stylesheet">

  <!-- Vendor CSS Files -->
  <link href="{{ '/assets/vendor/bootstrap/css/bootstrap.min.css' | relative_url }}" rel="stylesheet">
  <link href="{{ '/assets/vendor/bootstrap-icons/bootstrap-icons.css' | relative_url }}" rel="stylesheet">
  <link href="{{ '/assets/vendor/aos/aos.css' | relative_url }}" rel="stylesheet">
  <link href="{{ '/assets/vendor/glightbox/css/glightbox.min.css' | relative_url }}" rel="stylesheet">

  <!-- Main CSS File -->
  <link href="{{ '/assets/css/main.css' | relative_url }}" rel="stylesheet">
  {%- if page.youtube_id %}

  <!-- Structured Data -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "VideoObject",
    "name": {{ page.title | jsonify }},
    "description": {{ page.description | jsonify }},
    "thumbnailUrl": "https://i.ytimg.com/vi/{{ page.youtube_id }}/hqdefault.jpg",
    "uploadDate": "{{ page.date | date: '%Y-%m-%d' }}",
    "embedUrl": "https://www.youtube.com/embed/{{ page.youtube_id }}",
    "contentUrl": "https://www.youtube.com/shorts/{{ page.youtube_id }}",
    "publisher": {
      "@type": "Organization",
      "name": {{ site.title | jsonify }},
      "url": "{{ '/' | absolute_url }}"
    }
  }
  </script>
  {%- endif %}

</head>

<body class="{{ page.body_class }}">

  <header id="header" class="header d-flex align-items-center sticky-top">
    <div class="header-container container-fluid container-xl position-relative d-flex align-items-center justify-content-between">

      <a href="{{ '/' | relative_url }}" class="logo d-flex align-items-center me-auto me-xl-0">
        <span class="sitename">{{ site.title }}</span>
      </a>

      <nav id="navmenu" class="navmenu">
        <ul>
          <li><a href="{{ '/' | relative_url }}"{% if page.url == '/' %} class="active"{% endif %}>Home</a></li>
          <li><a href="{{ '/videos/' | relative_url }}"{% if page.url contains '/videos/' %} class="active"{% endif %}>Videos</a></li>
          {%- for social in site.data.social %}
          <li><a target="_blank" href="{{ social.url }}">{{ social.name }}</a></li>
          {%- endfor %}
        </ul>
        <i class="mobile-nav-toggle d-xl-none bi bi-list"></i>
      </nav>

    </div>
  </header>

  <main class="main">

    {{ content }}

  </main>

  <footer id="footer" class="footer">

    <div class="container">
      <div class="copyright text-center ">
        <p>© <span id="year"></span> <strong class="px-1 sitename">{{ site.title }}</strong> <span>All Rights Reserved</span></p>
      </div>
      <div class="social-links d-flex justify-content-center">
        {% include social-icons.html %}
      </div>
    </div>

  </footer>

  <!-- Scroll Top -->
  <a href="#" id="scroll-top" class="scroll-top d-flex align-items-center justify-content-center"><i class="bi bi-arrow-up-short"></i></a>

  <!-- Vendor JS Files -->
  <script src="{{ '/assets/vendor/bootstrap/js/bootstrap.bundle.min.js' | relative_url }}"></script>
  <script src="{{ '/assets/vendor/aos/aos.js' | relative_url }}"></script>
  <script src="{{ '/assets/vendor/glightbox/js/glightbox.min.js' | relative_url }}"></script>

  <!-- Main JS File -->
  <script src="{{ '/assets/js/main.js' | relative_url }}"></script>

  <script>
    document.getElementById('year').textContent =
      new Date().getFullYear();

    window.addEventListener("pageshow", function (event) {
      if (event.persisted || performance.getEntriesByType("navigation")[0].type === "back_forward") {
        document.querySelectorAll("form").forEach(form => {
          form.reset();
        });
      }
    });
  </script>

</body>

</html>
